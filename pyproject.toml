[project]
name = "fantrax-mcp"
version = "0.3.0"
description = "Read-only MCP server for a Fantrax H2H-categories NHL league + NHL schedule"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2,<3",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
]

[project.scripts]
fantrax-mcp = "fantrax_mcp.server:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fantrax_mcp"]
